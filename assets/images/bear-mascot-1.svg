<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bearGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D42B3E" />
      <stop offset="100%" stop-color="#8A1826" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#D42B3E" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="#D42B3E" fill-opacity="0.08" stroke="#D42B3E" stroke-opacity="0.2" stroke-width="2"/>
  
  <!-- Bear Ears -->
  <circle cx="55" cy="50" r="22" fill="url(#bearGrad1)" />
  <circle cx="55" cy="50" r="12" fill="#E8495A" />
  <circle cx="145" cy="50" r="22" fill="url(#bearGrad1)" />
  <circle cx="145" cy="50" r="12" fill="#E8495A" />
  
  <!-- Bear Head -->
  <circle cx="100" cy="95" r="55" fill="url(#bearGrad1)" filter="url(#shadow1)"/>
  
  <!-- Muzzle -->
  <ellipse cx="100" cy="110" rx="26" ry="20" fill="#FAFAFA" />
  <ellipse cx="100" cy="100" rx="10" ry="7" fill="#14161B" />
  <path d="M 100,107 Q 95,116 88,114 M 100,107 Q 105,116 112,114" stroke="#14161B" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Eyes -->
  <circle cx="80" cy="88" r="6" fill="#FAFAFA" />
  <circle cx="81" cy="87" r="3" fill="#14161B" />
  <circle cx="120" cy="88" r="6" fill="#FAFAFA" />
  <circle cx="119" cy="87" r="3" fill="#14161B" />
  
  <!-- Compass Icon Badge -->
  <circle cx="145" cy="135" r="24" fill="#1B1E24" stroke="#D42B3E" stroke-width="3"/>
  <path d="M 145,120 L 152,135 L 145,150 L 138,135 Z" fill="#D42B3E"/>
  <circle cx="145" cy="135" r="3" fill="#FAFAFA"/>
</svg>
